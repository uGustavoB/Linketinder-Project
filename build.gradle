plugins {
    id 'groovy'
    id 'application'
    id 'codenarc'
}

group = 'org.uGustavoDev'
version = '1.0-SNAPSHOT'

application {
    mainClass = 'org.uGustavoDev.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:4.0.29'
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
    testImplementation platform('org.spockframework:spock-bom:2.4-M4-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'net.bytebuddy:byte-buddy:1.14.9'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    codenarc 'org.codehaus.groovy:groovy-all:3.0.3'
    codenarc 'org.codenarc:CodeNarc:1.6.1'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

run {
    standardInput = System.in
    jvmArgs = ["-Dfile.encoding=UTF-8"]
}